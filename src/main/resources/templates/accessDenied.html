<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accesso negato</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- CSS personalizzato -->
    <link rel="stylesheet" th:href="@{/css/style1.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">

    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- La navbar e' fixed-top (70px): questa pagina usa style1.css, che non
     applica al body il padding di compensazione presente in style.css.
     Lo spazio superiore va quindi previsto qui, altrimenti il contenuto
     finisce sotto la barra. -->
<div class="container mt-5 pt-5">
    <h1>Accesso Negato</h1>
    <div th:if="${error}" class="alert alert-danger" role="alert"
         th:text="${error} ?: 'Errore sconosciuto.'"></div>
    <a href="/">Torna alla Home</a>
</div>
</body>
</html>
